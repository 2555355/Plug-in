name: Build FCL Turnip A6xx Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Rename APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/*.apk artifact/FCLTurnipA6xx-Plugin.apk
          ls -la artifact/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCLTurnipA6xx-Plugin-APK
          path: artifact/*.apk
          if-no-files-found: error

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: FCL Turnip A6xx Plugin v1.2.0
          body: |
            FCL launcher Turnip driver plugin — A6xx/A7xx build.

            - Driver: Mesa Turnip 26.3.0-devel (git-9c475fc367, Vulkan 1.4.335)
            - Source: https://github.com/whitebelyash/AdrenoToolsDrivers (release tu_v31, mainline-turnip-sync-V31, turnip/gen8 branch)
            - Plugin template: https://github.com/FCL-Team/FCLDriverPlugin
            - License: GPL-3.0 (see LICENSE / NOTICE for third-party attributions)

            Install the APK on a device with the FCL launcher to register the
            `Turnip A6xx v31` driver.
          files: artifact/*.apk
